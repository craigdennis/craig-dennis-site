<main>
  <section class="cs-hero">
    <div class="wrap wrap--content">
      <div class="sec-kicker">Blog</div>
      <h1>{{title}}</h1>
      <p class="blog-meta">
        <time datetime="{{dateIso}}">{{dateDisplay}}</time>
        {{tagsHtml}}
      </p>
      <p class="lead">{{description}}</p>
    </div>
  </section>

  <article class="blog-prose wrap wrap--content">
    {{content}}
  </article>

  <section class="section section--cta">
    <div class="wrap wrap--narrow">
      <h2 class="section-title">Want help compounding <em>organic growth?</em></h2>
      <p class="section-lead">Start a focused 30-day sprint — SEO, content, and AI-search systems scoped to pipeline.</p>
      <a class="btn btn-primary btn-lg" href="/contact/">Get in touch</a>
      <p class="blog-back"><a href="/blog/">← All posts</a></p>
    </div>
  </section>
</main>
